<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Todo Viewer</title>
  <style>
    .todo {
      transition: background-color 1s ease;
      padding: 8px;
      margin-bottom: 6px;
      border: 1px solid #555;
      border-radius: 6px;
      font-family: sans-serif;
    }

    .added {
      background-color: #7dd87d;
      color: white;
    }

    .updated {
      background-color: #ffc107;
      color: black;
    }

    .removed {
      background-color: #dc3545;
      color: white;
      animation: fadeOut 1.5s ease forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; height: auto; }
      to { opacity: 0; height: 0; margin: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <h2>Live Todo Dashboard</h2>
  <div id="container"></div>

  <script>
    let oldTodoState = [];

    function createChild(title, description, id) {
      const child = document.createElement('div');
      const titleDiv = document.createElement('div');
      const descriptionDiv = document.createElement('div');
      child.setAttribute('id', String(id));
      child.classList.add('todo');

      titleDiv.innerHTML = `<strong>${title}</strong>`;
      descriptionDiv.innerHTML = description;

      child.appendChild(titleDiv);
      child.appendChild(descriptionDiv);
      return child;
    }

    function addTodoToDom(todo) {
      const parent = document.getElementById('container');
      const child = createChild(todo.title, todo.description, todo.id);
      cleanClasses(child);
      child.classList.add('added');
      parent.appendChild(child);
    }

    function removeTodoFromDom(todo) {
      const element = document.getElementById(String(todo.id));
      if (element) {
        element.classList.add('removed');
        setTimeout(() => element.remove(), 1500);
      }
    }

    function updateTodoInDom(oldTodo, newTodo) {
      const element = document.getElementById(String(oldTodo.id));
      if (element && (oldTodo.title !== newTodo.title || oldTodo.description !== newTodo.description)) {
        element.innerHTML = `<div><strong>${newTodo.title}</strong></div><div>${newTodo.description}</div>`;
        cleanClasses(element);
        element.classList.add('updated');
        setTimeout(() => element.classList.remove('updated'), 1500);
      }
    }

    function updateState(newTodos) {
      const added = [];
      const deleted = [];
      const updated = [];

      const oldMap = new Map(oldTodoState.map(t => [t.id, t]));
      const newMap = new Map(newTodos.map(t => [t.id, t]));

      for (const newTodo of newTodos) {
        if (!oldMap.has(newTodo.id)) {
          added.push(newTodo);
        } else {
          const oldTodo = oldMap.get(newTodo.id);
          if (oldTodo.title !== newTodo.title || oldTodo.description !== newTodo.description) {
            updated.push([oldTodo, newTodo]);
          }
        }
      }

      for (const oldTodo of oldTodoState) {
        if (!newMap.has(oldTodo.id)) {
          deleted.push(oldTodo);
        }
      }

      added.forEach(addTodoToDom);
      deleted.forEach(removeTodoFromDom);
      updated.forEach(([oldTodo, newTodo]) => updateTodoInDom(oldTodo, newTodo));

      oldTodoState = [...newTodos];
    }

    function cleanClasses(element) {
      element.classList.remove('added', 'updated', 'removed');
    }

    setInterval(async () => {
      const res = await fetch("http://localhost:3000/data");
      const data = await res.json();
      updateState(data);
    }, 2200);
  </script>
</body>
</html>
